<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crops – AgriNode</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
  <div id="offline-banner"><i class="fa fa-wifi me-2"></i>No Internet</div>
  <div id="toast-container"></div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="logo-icon-sm">🌾</div>
        <div><span>AgriNode</span><small>Village Intel</small></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><i class="fa fa-home"></i> Dashboard</a>
      <a href="farmer.html" class="sidebar-link"><i class="fa fa-users"></i> Farmers</a>
      <a href="crop.html" class="sidebar-link active"><i class="fa fa-seedling"></i> Crops</a>
      <a href="finance.html" class="sidebar-link"><i class="fa fa-rupee-sign"></i> Finance</a>
      <a href="market.html" class="sidebar-link"><i class="fa fa-store"></i> Market</a>
      <a href="admin.html" class="sidebar-link"><i class="fa fa-shield-alt"></i> Admin</a>
      <a href="#" class="sidebar-link" onclick="doLogout()"><i class="fa fa-sign-out-alt"></i> Logout</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="sidebarInitial">A</div>
        <div>
          <div class="name" id="sidebarName">Agent</div>
          <div class="role-label" id="sidebarRole">Agent</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <button class="icon-btn hamburger" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
      <span class="topbar-title">🌾 Crop Management</span>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="toggleDark()"><i class="fa fa-moon"></i></button>
        <button class="btn-primary-custom" style="width:auto;padding:8px 16px;font-size:.85rem;"
          onclick="showAddModal()">
          <i class="fa fa-plus me-1"></i> Add Crop
        </button>
      </div>
    </div>

    <div class="page-content">
      <!-- Filter by farmer -->
      <div class="row g-2 mb-4">
        <div class="col-md-5">
          <select class="form-select" id="farmerFilter" onchange="renderCrops()">
            <option value="">All Farmers</option>
          </select>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="cropTypeFilter" onchange="renderCrops()">
            <option value="">All Crop Types</option>
            <option>Rice</option>
            <option>Wheat</option>
            <option>Maize</option>
            <option>Cotton</option>
            <option>Sugarcane</option>
            <option>Vegetables</option>
          </select>
        </div>
      </div>

      <div id="cropList">
        <div class="empty-state"><i class="fa fa-seedling"></i>
          <p>No crops added yet. Add your first crop!</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="dashboard.html" class="bn-item"><i class="fa fa-home"></i><span>Home</span></a>
      <a href="farmer.html" class="bn-item"><i class="fa fa-users"></i><span>Farmers</span></a>
      <a href="crop.html" class="bn-item active"><i class="fa fa-seedling"></i><span>Crops</span></a>
      <a href="finance.html" class="bn-item"><i class="fa fa-rupee-sign"></i><span>Finance</span></a>
      <a href="market.html" class="bn-item"><i class="fa fa-store"></i><span>Market</span></a>
    </div>
  </nav>

  <!-- Add Crop Modal -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:20px;border:none;">
        <div class="modal-header" style="border:none;padding:20px 24px 0;">
          <h5 class="modal-title fw-bold">🌾 Add Crop Record</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:16px 24px;">
          <div class="mb-3">
            <label class="form-label">Farmer *</label>
            <select id="cFarmer" class="form-select">
              <option value="">Select farmer...</option>
            </select>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Crop Name *</label>
              <select id="cCrop" class="form-select">
                <option value="">Select crop</option>
                <option>Rice</option>
                <option>Wheat</option>
                <option>Maize</option>
                <option>Cotton</option>
                <option>Sugarcane</option>
                <option>Vegetables</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">Season</label>
              <select id="cSeason" class="form-select">
                <option>Kharif</option>
                <option>Rabi</option>
                <option>Zaid</option>
              </select>
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label class="form-label">Quantity (quintals)</label>
              <input type="number" id="cQty" class="form-control" placeholder="50" min="0" />
            </div>
            <div class="col-6">
              <label class="form-label">Area (acres)</label>
              <input type="number" id="cArea" class="form-control" placeholder="2.5" step="0.5" min="0" />
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label class="form-label">Sow Date</label>
              <input type="date" id="cSowDate" class="form-control" />
            </div>
            <div class="col-6">
              <label class="form-label">Harvest Date</label>
              <input type="date" id="cHarvestDate" class="form-control" />
            </div>
          </div>
          <div class="mt-2">
            <label class="form-label">Notes</label>
            <input type="text" id="cNotes" class="form-control" placeholder="Any extra info..." />
          </div>
        </div>
        <div class="modal-footer" style="border:none;padding:0 24px 20px;gap:10px;">
          <button type="button" class="btn btn-light rounded-3 flex-fill" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-primary-custom" style="width:auto;flex:1;" onclick="addCrop()">
            <i class="fa fa-save me-1"></i> Save Crop
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const cu = getCurrentUser(); // from script.js _currentUser (in-memory, no localStorage)
    if (!cu) window.location.href = 'login.html';

    const CROP_EMOJI = { Rice: '🌾', Wheat: '🌿', Maize: '🌽', Cotton: '☁️', Sugarcane: '🎋', Vegetables: '🥬', Other: '🌱' };
    let addModal;

    function showAddModal() { populateFarmerDropdown('cFarmer'); addModal.show(); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
    function toggleDark() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); localStorage.setItem('agri_theme', t); } // ✅ keep: UI preference
    function doLogout() { _currentUser = null; window.location.href = 'login.html'; }
    function showToast(msg, type = '') {
      const c = document.createElement('div'); c.className = 'toast-msg ' + type;
      c.innerHTML = `<i class="fa fa-check-circle"></i> ${msg}`;
      document.getElementById('toast-container').appendChild(c); setTimeout(() => c.remove(), 3500);
    }

    // Data helpers use _store from script.js (in-memory, no localStorage)
    function saveCrops(c) { _store.crops = c; } // mutates in-memory store

    function populateFarmerDropdown(selId) {
      const sel = document.getElementById(selId);
      const farmers = getFarmers();
      const cur = sel.value;
      sel.innerHTML = '<option value="">Select farmer...</option>' + farmers.map(f => `<option value="${f.id}" ${f.id == cur ? 'selected' : ''}>${f.name} – ${f.village}</option>`).join('');
    }

    function addCrop() {
      const farmerId = document.getElementById('cFarmer').value;
      const cropName = document.getElementById('cCrop').value;
      if (!farmerId || !cropName) { showToast('Farmer and Crop are required', 'error'); return; }
      const farmers = getFarmers(); const farmer = farmers.find(f => f.id == farmerId);
      const crops = getCrops();
      crops.push({
        id: Date.now(), farmerId, farmerName: farmer ? farmer.name : '', cropName,
        season: document.getElementById('cSeason').value,
        qty: document.getElementById('cQty').value,
        area: document.getElementById('cArea').value,
        sowDate: document.getElementById('cSowDate').value,
        harvestDate: document.getElementById('cHarvestDate').value,
        notes: document.getElementById('cNotes').value,
        addedAt: new Date().toLocaleDateString()
      });
      saveCrops(crops);
      addModal.hide();
      showToast('Crop record saved! 🌾');
      renderCrops();
    }

    function deleteCrop(id) {
      if (!confirm('Delete this crop record?')) return;
      saveCrops(getCrops().filter(c => c.id !== id));
      showToast('Crop removed', 'error'); renderCrops();
    }

    function renderCrops() {
      const ff = document.getElementById('farmerFilter').value;
      const cf = document.getElementById('cropTypeFilter').value;
      let crops = getCrops().filter(c => (!ff || c.farmerId == ff) && (!cf || c.cropName === cf));
      const el = document.getElementById('cropList');
      if (!crops.length) { el.innerHTML = '<div class="empty-state"><i class="fa fa-seedling"></i><p>No crop records found</p></div>'; return; }
      el.innerHTML = crops.map(c => `
        <div class="crop-card">
          <div class="crop-icon">${CROP_EMOJI[c.cropName] || '🌱'}</div>
          <div style="flex:1;">
            <div class="crop-name">${c.cropName} <span style="font-size:.75rem;background:#E8F5E9;color:var(--primary);border-radius:10px;padding:2px 8px;">${c.season || ''}</span></div>
            <div class="crop-detail">
              <i class="fa fa-user me-1"></i>${c.farmerName}
              ${c.qty ? `&nbsp;·&nbsp;<i class="fa fa-weight-hanging me-1"></i>${c.qty} qtl` : ''}
              ${c.area ? `&nbsp;·&nbsp;<i class="fa fa-expand me-1"></i>${c.area} ac` : ''}
            </div>
            ${c.sowDate ? `<div class="crop-detail"><i class="fa fa-calendar me-1"></i>Sown: ${c.sowDate}${c.harvestDate ? ' &nbsp; Harvest: ' + c.harvestDate : ''}</div>` : ''}
          </div>
          <button class="btn-sm-custom btn-delete" style="flex:0;" onclick="deleteCrop(${c.id})"><i class="fa fa-trash"></i></button>
        </div>`).join('');
    }

    function populateFarmerFilter() {
      const farmers = getFarmers();
      const sel = document.getElementById('farmerFilter');
      const cur = sel.value;
      sel.innerHTML = '<option value="">All Farmers</option>' + farmers.map(f => `<option value="${f.id}" ${f.id == cur ? 'selected' : ''}>${f.name}</option>`).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      addModal = new bootstrap.Modal(document.getElementById('addModal'));
      if (cu) { document.getElementById('sidebarName').textContent = cu.name; document.getElementById('sidebarRole').textContent = cu.role; document.getElementById('sidebarInitial').textContent = cu.name.charAt(0); }
      document.documentElement.setAttribute('data-theme', localStorage.getItem('agri_theme') || 'light'); // ✅ keep: UI preference
      populateFarmerFilter(); renderCrops();
      // Check URL param
      const params = new URLSearchParams(window.location.search);
      if (params.get('farmer')) { document.getElementById('farmerFilter').value = params.get('farmer'); renderCrops(); }
      window.addEventListener('offline', () => document.getElementById('offline-banner').style.display = 'block');
      window.addEventListener('online', () => document.getElementById('offline-banner').style.display = 'none');
    });
  </script>
</body>

</html>
